name: build

# Runs the tests on every push/PR. Tags like v1.0.0 also build the installer + portable exe and
# attach them to a GitHub Release. If the repository has the SIGNING_PFX_BASE64 / SIGNING_PFX_PASSWORD
# secrets (a code-signing certificate), the files are signed; otherwise they are published unsigned.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # to attach files to the release

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Test
        run: python -m pytest

      - name: Check the tag matches the app version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $version = (Select-String -Path app/__init__.py -Pattern '__version__ = "(.+)"').Matches[0].Groups[1].Value
          if ("v$version" -ne "${{ github.ref_name }}") { throw "Tag ${{ github.ref_name }} does not match app version $version" }

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Prepare signing certificate (optional)
        id: cert
        shell: pwsh
        env:
          PFX_BASE64: ${{ secrets.SIGNING_PFX_BASE64 }}
        run: |
          if ($env:PFX_BASE64) {
            [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\signing.pfx", [Convert]::FromBase64String($env:PFX_BASE64))
            "available=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          } else {
            "available=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          }

      - name: Build (unsigned)
        if: steps.cert.outputs.available != 'true'
        shell: pwsh
        run: ./scripts/build.ps1

      - name: Build (signed)
        if: steps.cert.outputs.available == 'true'
        shell: pwsh
        env:
          PFX_PASSWORD: ${{ secrets.SIGNING_PFX_PASSWORD }}
        run: ./scripts/build.ps1 -Sign -PfxPath "$env:RUNNER_TEMP\signing.pfx" -PfxPassword (ConvertTo-SecureString $env:PFX_PASSWORD -AsPlainText -Force)

      - uses: actions/upload-artifact@v4
        with:
          name: COOL68-Open-Driver-windows
          path: release/*

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
